# agentforge.yml — Full configuration reference
# Copy to agentforge.yml and edit with your values

project:
  name: "My Project"
  budget: 50.00            # Max spend in USD
  currency: USD

# ─── PROVIDERS ─────────────────────────────────────────
# Configure each AI provider with API keys and quota limits.
# Keys can reference environment variables with ${VAR} syntax.

providers:
  anthropic:
    enabled: true
    api_key: ${ANTHROPIC_API_KEY}
    endpoint: https://api.anthropic.com  # Override for proxies
    quota:
      max_requests_per_minute: 100
      max_tokens_per_minute: 400000
      auto_pause: true       # Pause agents when quota exhausted
      auto_resume: true      # Resume when quota window resets

  google:
    enabled: true
    api_key: ${GOOGLE_AI_KEY}
    endpoint: https://generativelanguage.googleapis.com
    quota:
      max_requests_per_minute: 60
      auto_pause: true
      auto_resume: true

  openai:
    enabled: false
    api_key: ${OPENAI_API_KEY}
    quota:
      max_requests_per_minute: 500

  deepseek:
    enabled: true
    api_key: ${DEEPSEEK_API_KEY}
    endpoint: https://api.deepseek.com
    quota:
      max_requests_per_minute: 120

  moonshot:
    enabled: false
    api_key: ${MOONSHOT_API_KEY}
    endpoint: https://api.moonshot.cn

  openrouter:
    enabled: false
    api_key: ${OPENROUTER_API_KEY}
    endpoint: https://openrouter.ai/api
    quota:
      max_spend_per_day: 10.00  # Dollar limit

  ollama:
    enabled: true
    endpoint: http://localhost:11434
    # No API key needed. No quota — local is unlimited.

# ─── MODELS ────────────────────────────────────────────
# Model registry with tier classification and pricing.
# Each key is the model ID sent to the provider API.
# Pricing is USD per 1M tokens (input / output), standard tier, checked 2026-10-27.
# Sources: platform.claude.com/docs/en/about-claude/pricing,
# ai.google.dev/gemini-api/docs/pricing, api-docs.deepseek.com/quick_start/pricing

models:
  claude-opus-5-5:
    provider: anthropic
    tier: 1
    cost_in: 4.00
    cost_out: 20.00
    context: 1000000

  claude-sonnet-5-5:
    provider: anthropic
    tier: 2
    cost_in: 2.00
    cost_out: 10.00
    context: 1000000

  claude-haiku-5-5:
    provider: anthropic
    tier: 3
    cost_in: 0.10            # Prompts up to 100K tokens; $0.50 / $2.50 above
    cost_out: 0.50
    context: 1000000

  gemini-4-argon:
    provider: google
    tier: 1
    cost_in: 2.00            # Google lists $4.00 / $20.00 from 2026-12-01
    cost_out: 10.00
    context: 1000000

  gemini-3.8-flash:
    provider: google
    tier: 2
    cost_in: 0.75            # Google lists $1.50 / $7.50 from 2027-01-01
    cost_out: 3.75
    context: 1000000

  deepseek-v4-pro:
    provider: deepseek
    tier: 2
    cost_in: 1.32            # Peak rate (cache miss); off-peak is half
    cost_out: 3.96
    context: 1000000

  deepseek-flash:
    provider: deepseek
    tier: 3
    cost_in: 0.30            # Peak rate (cache miss); off-peak is half
    cost_out: 1.20
    context: 1000000

  codestral:22b:
    provider: ollama
    tier: 3
    cost_in: 0
    cost_out: 0
    context: 32000

  deepseek-r1:32b:
    provider: ollama
    tier: 3
    cost_in: 0
    cost_out: 0
    context: 128000

# ─── ROUTING ───────────────────────────────────────────
# Rules are evaluated in order. First match wins.
# Available matchers: type, context_tokens_gt, budget_remaining_lt
# Every model named here or under team: must be listed under models:,
# and its provider must be listed under providers:. Startup fails otherwise.

routing:
  rules:
    # Large context → Gemini
    - match: { context_tokens_gt: 200000 }
      force: gemini-4-argon

    # Low budget → local only
    - match: { budget_remaining_lt: 0.10 }
      force_tier: 3
      prefer_local: true

    # Strategy tasks → Tier 1
    - match: { type: [architecture, planning, review, security_audit] }
      tier: 1
      prefer: claude-opus-5-5
      fallback: [gemini-4-argon]

    # Development tasks → Tier 2
    - match: { type: [implement, refactor, code_review, debug] }
      tier: 2
      prefer: claude-sonnet-5-5
      fallback: [gemini-3.8-flash, deepseek-v4-pro]

    # Execution tasks → Tier 3 (prefer local)
    - match: { type: [test, script, bulk, migration, format] }
      tier: 3
      prefer: codestral:22b           # Local first
      fallback: [deepseek-flash, claude-haiku-5-5]

  fallback_strategy: same_tier_then_downgrade
  cost_optimization: true

# ─── TEAM ──────────────────────────────────────────────
# Agent definitions. Each agent has a model, prompt, and tools.

team:
  - name: Architect
    role: Lead Architect
    model: claude-opus-5-5
    system_prompt_file: prompts/architect.md
    tools: [file_read, ask_agent]
    require_review: false

  - name: Developer
    role: Backend Developer
    model: claude-sonnet-5-5
    fallback_models: [gemini-3.8-flash, deepseek-v4-pro]
    system_prompt_file: prompts/developer.md
    tools: [file_read, file_write, git_commit, run_tests, ask_agent]
    require_review: true
    reviewer: Architect
    max_cost_per_task: 5.00

  - name: Tester
    role: QA Engineer
    model: deepseek-flash
    fallback_models: [codestral:22b]
    system_prompt_file: prompts/tester.md
    tools: [file_read, file_write, run_tests]
    allow_tier_downgrade: true

# ─── GIT ───────────────────────────────────────────────

git:
  enabled: true
  remote: origin
  base_branch: develop
  branch_pattern: "agent/{agent_name}/{task_id}"
  commit_format: "[T{tier}] {task_title} (#{task_id})"
  auto_branch: true
  auto_commit: true
  auto_pr: true
  require_review_before_merge: true
  auto_merge_on_ci_pass: false

# ─── EXECUTOR ──────────────────────────────────────────
# Coding tasks run `claude -p` in a per-task container (src/execution/coding-executor.js).
# Not wired into the orchestrator yet.

executor:
  image: node:24
  state_dir: .agentforge/workspaces      # per-task clones and HOMEs
  pstack_dir: ~/.claude/plugins/cache/cursor-plugins/pstack/0.15.30   # pinned pstack, mounted read-only
  claude_bin: ~/.local/share/claude/versions/2.1.312                   # default: realpath of ~/.local/bin/claude
  model: sonnet
  effort: medium
  budget_usd: 2.00         # --max-budget-usd when a task has no budget
  timeout_minutes: 30      # then SIGTERM and `docker stop -t 10`
  oauth_token: ${CLAUDE_CODE_OAUTH_TOKEN}   # preferred; from `claude setup-token`
  credentials_file: ~/.claude/.credentials.json   # fallback, copied into the task HOME and removed after
  git_author:
    name: agentforge
    email: agentforge@localhost

# ─── ALERTS ────────────────────────────────────────────

alerts:
  budget_warning_pct: 0.80
  budget_pause_pct: 0.95
  # slack_webhook: ${SLACK_WEBHOOK}
  # email: you@example.com

# ─── SERVER ────────────────────────────────────────────

server:
  port: 4242
  host: localhost
  auth:
    enabled: false          # Set to true + provide secret for production
    secret: ${AGENTFORGE_SECRET}
